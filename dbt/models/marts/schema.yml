version: 2
models:
  - name: mart_indicadores_diarios
    description: Indicadores financieros de México por día hábil (Banxico).
    columns:
      - name: fecha
        tests: [unique, not_null]
      - name: usd_mxn
        tests: [not_null]
      - name: inflacion_anual_pct
        description: Variación anual del INPC, conocida desde el mes siguiente.
      - name: tasa_real_tiie_pct
        description: TIIE 28d deflactada con la inflación anual vigente (Fisher).
  - name: mart_cripto_diario
    description: Precio de cierre, retornos y volatilidad por par de Binance (velas cerradas, UTC).
    columns:
      - name: par
        tests: [not_null]
      - name: fecha
        tests: [not_null]
      - name: cierre
        tests: [not_null]

  - name: mart_cripto_vs_fix
    description: >
      Precio de BTC, ETH y USDT en pesos según Binance frente al precio implícito con el
      FIX de Banxico. En fines de semana y feriados se usa el último FIX publicado.
    columns:
      - name: fecha
        tests: [not_null]
      - name: activo
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BTC', 'ETH', 'USDT']
      - name: usd_mxn_fix
        tests: [not_null]
      - name: prima_vs_fix_pct
        description: Precio directo en pesos / (precio en USDT x FIX) - 1, en %. Nulo si no existe el par en pesos ese día.
